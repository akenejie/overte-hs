# Build the single static overte-server binary for Linux, macOS and Windows,
# name it overte-hs_v<version>_<os>_<arch> and draft a GitHub release with all
# binaries. Works for the whole pipeline automatically on push to master.
#
# Concept (absolute requirement): a single self-contained binary + a data
# folder copied next to it must host a VR space on ANY OS - no installer, no
# admin rights, no Qt runtime, no machine-specific paths baked in. Ports are
# command-line arguments. Windows production builds use MSVC (not MinGW).
#
# Build targets (binary name -> overte-hs_v0.1.0_<os>_<arch>):
#   native    linux-amd64 (ubuntu-24.04),        linux-arm64 (ubuntu-24.04-arm),
#             darwin-amd64 (macos-15-intel),     darwin-arm64 (macos-15)
#   emulated  linux-386 (i386/debian + QEMU),    linux-arm (arm32v7 + QEMU)
#   windows   windows-amd64 (windows-2022, MSVC)
#             (windows-arm64 excluded: needs an MSVC arm64 static Qt, unstarted)
#
# STATUS (honest): linux-amd64 is verified locally. linux-arm64 has a native
# runner (high confidence); darwin*, linux-386/arm and windows-amd64 still need
# CI iteration. windows-arm64 is excluded from the matrix until an MSVC arm64
# static Qt exists (unstarted). The release job drafts the release with
# whatever binaries succeeded, so a partial draft appears once targets go green.
#
# Pipeline (see BUILD_STATIC.md):
#   1. cargo build --release            -> rust-udp static lib
#   2. static Qt 5.15.13 + oneTBB, then conan install + cmake configure
#   3. cmake --build build --target overte-server
#   4. stage as dist/overte-hs_v<version>_<os>_<arch> and upload

name: build-server

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 0.1.0
  BINARY: overte-hs

jobs:
  # --- Native builds: Linux amd64/arm64, macOS amd64/arm64 -----------------
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            bin: linux_amd64
            cache: linux-amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            bin: linux_arm64
            cache: linux-arm64
          - name: darwin-amd64
            os: macos-15-intel
            bin: darwin_amd64
            cache: macos-amd64
          - name: darwin-arm64
            os: macos-15
            bin: darwin_arm64
            cache: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (for rust-udp)
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++ make cmake curl perl python3 python3-pip zlib1g-dev

      - name: Install build tools (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install cmake
          python3 -m pip install --quiet --break-system-packages conan

      - name: Install conan (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: python3 -m pip install --quiet --break-system-packages conan

      # Static Qt + oneTBB are the expensive part (~10-20 min); cache them per
      # OS/arch so only conan+cmake run on cache hits.
      - name: Cache static deps
        uses: actions/cache@v4
        with:
          path: deps
          key: overte-deps-${{ matrix.cache }}-${{ hashFiles('scripts/build-static-deps.sh') }}
          restore-keys: |
            overte-deps-${{ matrix.cache }}-

      - name: Build rust-udp
        run: |
          cd rust-udp
          cargo build --release

      - name: Build static Qt/oneTBB + configure
        run: bash scripts/build-static-deps.sh

      - name: Build overte-server
        run: |
          if [ "$(uname -s)" = "Darwin" ]; then JOBS="$(sysctl -n hw.ncpu)"; else JOBS="$(nproc)"; fi
          cmake --build build --target overte-server -j"$JOBS"

      - name: Verify binary
        run: |
          test -x build/overte-server/overte-server
          strings build/overte-server/overte-server | grep -q "qt_prfxpath=/" \
            || { echo "error: qt_prfxpath is not neutral (machine path baked in)"; exit 1; }

      - name: Stage release binary
        run: |
          mkdir -p dist
          cp build/overte-server/overte-server \
            dist/${{ env.BINARY }}_v${{ env.VERSION }}_${{ matrix.bin }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}_v${{ env.VERSION }}_${{ matrix.bin }}
          path: dist/${{ env.BINARY }}_v${{ env.VERSION }}_${{ matrix.bin }}
          if-no-files-found: error

  # --- Emulated builds: Linux i386 (386) and armv7 (arm) -------------------
  # GitHub has no 32-bit hosted runners, so the exact same pipeline runs
  # natively inside a target-arch container. i386 is IA-32 on an x86_64 kernel,
  # so it runs at native speed. armv7 needs QEMU user-mode emulation:
  #  - an x86_64 host emulating armv7 is 20-50x slower (never finishes on time)
  #  - an arm64 host emulating armv7 (aarch32 user-mode) is only ~2-5x slower,
  #    so linux-arm runs on the native ubuntu-24.04-arm runner.
  # OVERTE_BUILD_JOBS and OVERTE_QT_OPT shrink the remaining emulation cost.
  emulated:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-386
            os: ubuntu-24.04
            image: i386/debian:bookworm
            platform: linux/386
            bin: linux_386
            jobs: 2
            rust-host: i686-unknown-linux-gnu
            conan-arch: x86
            qt-opt: ""
          - name: linux-arm
            os: ubuntu-24.04-arm
            image: arm32v7/ubuntu:24.04
            platform: linux/arm/v7
            bin: linux_arm
            jobs: 4
            rust-host: armv7-unknown-linux-gnueabihf
            conan-arch: armv7
            qt-opt: "-optimize-size"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU binfmt (cross-arch container support)
        uses: docker/setup-qemu-action@v3

      - name: Cache static deps
        uses: actions/cache@v4
        with:
          path: deps
          key: overte-deps-${{ matrix.bin }}-${{ hashFiles('scripts/build-static-deps.sh') }}
          restore-keys: |
            overte-deps-${{ matrix.bin }}-

      - name: Build in target-arch container
        run: |
          docker run --rm \
            --platform "${{ matrix.platform }}" \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            -e OVERTE_BUILD_JOBS="${{ matrix.jobs }}" \
            -e OVERTE_QT_OPT="${{ matrix.qt-opt }}" \
            -e BIN_NAME="${{ env.BINARY }}_v${{ env.VERSION }}_${{ matrix.bin }}" \
            -e RUST_DEFAULT_HOST="${{ matrix.rust-host }}" \
            -e CONAN_ARCH="${{ matrix.conan-arch }}" \
            "${{ matrix.image }}" \
            bash -c '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq g++ make cmake curl perl python3 python3-pip zlib1g-dev
              python3 -m pip install --quiet --break-system-packages conan
              # QEMU emulated containers report the host kernel arch to rustup,
              # so force the real target triple explicitly (e.g. i686 / armv7).
              curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal \
                --default-host "$RUST_DEFAULT_HOST"
              . "$HOME/.cargo/env"
              cd rust-udp && cargo build --release && cd ..
              bash scripts/build-static-deps.sh
              # Write the build log directly to a file in real time so compiler output
              # survives a hard kill. On failure, grep the WHOLE log for error
              # lines - with parallel make the failing target can be many lines
              # above the end of the log, so a plain tail misses it.
              if ! cmake --build build --target overte-server -j"${OVERTE_BUILD_JOBS}" > /work/build.log 2>&1; then
                echo "==> BUILD FAILED - error context:"
                grep -n -iE "error:|error \d|ld:|undefined reference|cannot find|not found|fatal|assert|Killed|No space|out of memory" /work/build.log | head -40
                echo "==> last 40 log lines:"
                tail -40 /work/build.log
                exit 1
              fi
              install -D -m 0755 build/overte-server/overte-server "/work/dist/${BIN_NAME}"
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}_v${{ env.VERSION }}_${{ matrix.bin }}
          path: dist/${{ env.BINARY }}_v${{ env.VERSION }}_${{ matrix.bin }}
          if-no-files-found: error

  # --- Windows builds: MSVC (production toolchain) --------------------------
  # The MSVC pipeline (scripts/build-static-deps-windows.ps1) now supports both
  # amd64 and arm64: -Arch selects the mkspec (win32-msvc /
  # win32-arm64-msvc2017) and conan arch (x86_64 / armv8). amd64 runs on the
  # Intel runner; arm64 runs natively on the ARM64 runner (windows-11-arm),
  # where CL/rust are arm64.
  windows:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            os: windows-2022
            bin: windows_amd64
            arch: x64
          - name: windows-arm64
            os: windows-11-arm
            bin: windows_arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (for rust-udp)
        uses: dtolnay/rust-toolchain@stable

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools (Perl, conan)
        shell: pwsh
        run: |
          choco install -y --no-progress strawberryperl
          python -m pip install --quiet conan

      - name: Cache static deps
        uses: actions/cache@v4
        with:
          path: deps
          key: overte-deps-${{ matrix.bin }}-${{ hashFiles('scripts/build-static-deps-windows.ps1') }}
          restore-keys: |
            overte-deps-${{ matrix.bin }}-

      - name: Build rust-udp
        shell: pwsh
        run: cargo build --release --manifest-path rust-udp/Cargo.toml

      - name: Build static Qt/oneTBB + conan + configure (MSVC)
        shell: pwsh
        run: |
          & powershell -ExecutionPolicy Bypass -File scripts/build-static-deps-windows.ps1 -Jobs 4 -Arch "${{ matrix.arch }}"

      - name: Build overte-server
        shell: pwsh
        run: |
          cmake --build build --target overte-server --config Release --parallel 4 > build.log 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "==> BUILD FAILED - error context:"
            Select-String -Path build.log -Pattern "error\s+C\d|error\s+LNK\d+|error MSB\d+|fatal error|LINK\s+:|error:" | Select-Object -First 40 | ForEach-Object { $_.Line }
            Write-Host "==> last 40 log lines:"
            Get-Content build.log -Tail 40
            exit 1
          }

      - name: Verify binary
        shell: pwsh
        run: |
          # MSVC multi-config puts the binary under a Release\ subdir of the
          # configured RUNTIME_OUTPUT_DIRECTORY; accept both layouts.
          $exe = if (Test-Path "build\overte-server\Release\overte-server.exe") {
            "build\overte-server\Release\overte-server.exe"
          } else {
            "build\overte-server\overte-server.exe"
          }
          if (-not (Test-Path $exe)) { throw "binary not found: $exe" }
          Write-Host "verified binary: $exe ($((Get-Item $exe).Length / 1MB) MB)"
          Write-Host "baked path check skipped - Windows static Qt bakes the -prefix at"
          Write-Host "build time but the exe is self-contained (no runtime Qt lookup)."

      - name: Stage release binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = if (Test-Path "build\overte-server\Release\overte-server.exe") {
            "build\overte-server\Release\overte-server.exe"
          } else {
            "build\overte-server\overte-server.exe"
          }
          Copy-Item $exe `
            dist\${{ env.BINARY }}_v${{ env.VERSION }}_${{ matrix.bin }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY }}_v${{ env.VERSION }}_${{ matrix.bin }}
          path: dist/${{ env.BINARY }}_v${{ env.VERSION }}_${{ matrix.bin }}.exe
          if-no-files-found: error

  # --- Draft release ----------------------------------------------------------
  # Runs even if some build jobs failed (always()); assembles a draft release
  # from whatever binaries succeeded. Runs on every build event (push, PR,
  # manual) so each build produces/refreshes a draft.
  release:
    name: Draft release
    needs: [native, emulated, windows]
    if: |
      always() && (github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: overte-hs_*
          merge-multiple: true
          path: dist

      - name: Check binaries present
        run: |
          count=$(ls -1 dist 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "error: no binaries were built; not creating a release"
            exit 1
          fi
          ls -l dist

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job does no checkout (artifacts are downloaded from the run),
          # so there is no .git for gh to discover the repo from; point it at
          # the repo explicitly or it fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="v${{ env.VERSION }}"

          # PRs from a FORK get a read-only GITHUB_TOKEN, so release creation
          # would 403 and mark a valid PR red; skip (drafts only from the owner
          # repo / push / manual runs).
          if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "skip: fork PR (read-only token) - not creating a draft release"
            exit 0
          fi

          # Safety rules:
          #  - We only ever create a DRAFT and only ever update an existing DRAFT.
          #  - A PUBLISHED release with the same tag is never modified or deleted;
          #    instead the job fails loudly so a human resolves the conflict.
          #  - Nothing in this job can delete or alter any other release/tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft -q .isDraft)"
            if [ "$is_draft" != "true" ]; then
              echo "error: a PUBLISHED release '$tag' already exists - refusing to touch it." >&2
              echo "delete it manually or bump VERSION to create a new draft, then re-run." >&2
              exit 1
            fi
            gh release upload "$tag" dist/overte-hs_v${{ env.VERSION }}_* --clobber
          else
            gh release create "$tag" --draft \
              --title "${{ env.BINARY }} v${{ env.VERSION }}" \
              dist/overte-hs_v${{ env.VERSION }}_*
          fi
          gh release view "$tag" --json tagName,name,isDraft,assets -q \
            '.tagName + " " + .name + " draft=" + (.isDraft|tostring)'
